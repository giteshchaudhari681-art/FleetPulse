name: CI

on:
  push:
    branches: [ "main", "feat/*", "bug/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-foundation:
    name: Verify Foundation & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Roadmap Integrity
        run: node scripts/verify-roadmap.js

      - name: Verify Required Files Exist
        run: |
          test -f README.md
          test -f .env.example
          test -f .gitignore
          test -f docs/product/ROADMAP.md
          test -f docs/product/PRODUCT_VISION.md
          test -f docs/product/FEATURES.md
          test -f docs/product/SCOPE.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/ENGINEERING_STANDARDS.md
          echo "All required foundation files exist."

      - name: Verify No Accidental Secrets
        run: |
          if [ -f .env ]; then
            echo "❌ Error: .env file found in repository. Secrets should not be committed."
            exit 1
          fi
          echo "No .env secrets committed."

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        working-directory: ./apps/api
        run: npm run format:check

      - name: Lint
        working-directory: ./apps/api
        run: npm run lint

      - name: Typecheck
        working-directory: ./apps/api
        run: npm run typecheck

      - name: Test
        working-directory: ./apps/api
        run: npm run test

      - name: Build
        working-directory: ./apps/api
        run: npm run build

  config-ci:
    name: Config CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        working-directory: ./packages/config
        run: npm run typecheck

      - name: Test
        working-directory: ./packages/config
        run: npm run test

      - name: Build
        working-directory: ./packages/config
        run: npm run build

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        working-directory: ./apps/web
        run: npm run format:check

      - name: Lint
        working-directory: ./apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: ./apps/web
        run: npm run typecheck

      - name: Test
        working-directory: ./apps/web
        run: npm run test -- --run

      - name: Build
        working-directory: ./apps/web
        run: npm run build
